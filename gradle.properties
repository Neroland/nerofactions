# ----------------------------------------------------------------------------
# NeroFactions cross-loader build — MultiLoader-Template (ModDevGradle + Fabric Loom + ForgeGradle)
#
# Barebones skeleton scaffolded to match the Nerospace build exactly. Run from
# the repo root with its Gradle 9.6.0 wrapper.
#
# Layout (no architectury-loom):
#   common   -> net.neoforged.moddev, NeoForm-only (de-obfuscated vanilla); spliced into each node
#   fabric   -> net.fabricmc.fabric-loom (omits `mappings` for de-obf 26.x)
#   neoforge -> net.neoforged.moddev (full NeoForge userdev)
#   forge    -> net.minecraftforge.gradle (full Forge userdev)
# common's source is shared into fabric/neoforge/forge (one copy -> no drift).
#
# Version axis = Stonecutter: each loader x MC version is its own node
# (:fabric:26.1.2 :fabric:26.2 :neoforge:26.1.2 :neoforge:26.2 :forge:26.1.2 :forge:26.2).
# ----------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
# ModDevGradle/Loom do not always agree with the configuration cache; off here.
org.gradle.configuration-cache=false

## Mod metadata (shared by all loaders) --------------------------------------
mod_id=nerofactions
mod_name=NeroFactions
# The mod version is independent of the Minecraft version; it is the same for all builds.
mod_version=0.1.0-beta.1
mod_group_id=za.co.neroland.nerofactions
mod_license=All Rights Reserved (modpacks allowed - see LICENSE)
mod_authors=Neroland

## IDE-active Minecraft default (Stonecutter) --------------------------------
minecraft_version=26.2

## Version matrix (CI iterates these) ---------------------------------------
mc_versions=26.1.2,26.2

## NeoForm — de-obfuscated vanilla base the `common` module compiles against
neo_form_version_26.1.2=26.1.2-1
neo_form_version_26.2=26.2-2

## NeoForge userdev — the `neoforge` module
neo_version_26.1.2=26.1.2.97
neo_version_26.2=26.2.0.64

## MinecraftForge / Forge userdev — the `forge` module
forge_version_26.1.2=26.1.2-64.1.2
forge_version_26.2=26.2-65.1.2

## JEI (mezz.jei, BlameJared maven) — common API recipe-viewer compat
jei_version_26.1.2=29.29.0.77
jei_version_26.2=30.25.0.177

## Neroland Core — shared foundation library (required dependency, loads BEFORE NeroFactions).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## mavenLocal() or the NerolandCoreGitHubPackages maven declared in stonecutter.gradle. The manifest
## floor is this pinned version (floor = compiled Core version) so the loader refuses a Core too old
## to have the APIs NeroFactions compiles against (config schema, reputation, data erasure,
## progression gates, threshold events, link SPI).
nerolandcore_version=1.11.0

## NeroEconomy — OPTIONAL sibling (Stage 4 price-modifier soft integration). compileOnly ONLY:
## integration/economy/* compiles against NeroEconomy's api package, but nothing of NeroEconomy
## ships in this jar, no loader manifest names it, and the bridge class is touched only behind the
## runtime isModLoaded("neroeconomy") guard (the ecosystem rule — no reflection, structural
## classload isolation). NeroEconomy has NO maven-publish config, so each loader build resolves the
## sibling repo's built jar as a plain file (../neroeconomy/<loader>/versions/<mc>/build/libs/);
## build the matching ../neroeconomy cell first if that jar is missing or stale.
neroeconomy_version=0.0.1-alpha.1

## Fabric (https://fabricmc.net/develop) ------------------------------------
fabric_loader_version=0.19.3
fabric_api_version_26.1.2=0.155.2+26.1.2
fabric_api_version_26.2=0.158.0+26.2
